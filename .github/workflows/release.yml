name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Purge stale caches & artifacts (prevent storage lock)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --paginate repos/${{ github.repository }}/actions/caches \
            -q '.actions_caches[].id' 2>/dev/null | \
            xargs -r -n1 -I{} gh api -X DELETE \
              repos/${{ github.repository }}/actions/caches/{} 2>/dev/null
          gh api --paginate repos/${{ github.repository }}/actions/artifacts \
            -q '.artifacts[].id' 2>/dev/null | \
            xargs -r -n1 -I{} gh api -X DELETE \
              repos/${{ github.repository }}/actions/artifacts/{} 2>/dev/null
          exit 0

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release APK
        env:
          EQ_STORE_FILE: ${{ github.workspace }}/app/release.keystore
          EQ_STORE_PASSWORD: ${{ secrets.EQ_STORE_PASSWORD }}
          EQ_KEY_ALIAS: ${{ secrets.EQ_KEY_ALIAS }}
          EQ_KEY_PASSWORD: ${{ secrets.EQ_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Stage + verify APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk equalizer-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs equalizer-release.apk | head -6

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" equalizer-release.apk \
            --title "NativeEQ $TAG" \
            --latest \
            --notes "$(printf 'arm64-v8a signed release (v1+v2+v3 schemes). Install or auto-update via Obtainium.\n\nSupport development: https://ko-fi.com/indodankabis\n')"
